<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaultly | My vault</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("vaultly-theme")==="dark"?"dark":"light"}catch(error){}</script>
<script>try{if(sessionStorage.getItem("vaultly-dashboard-splash")==="1"){document.documentElement.classList.add("show-dashboard-splash");sessionStorage.removeItem("vaultly-dashboard-splash")}}catch(error){}</script>
<link rel="icon" type="image/png" href="vaultly-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=DM+Mono:wght@400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F5EEDC; --cream-2:#EDE4CF; --paper:#FAF6EC; --card:rgba(250,246,236,.92);
    --brown:#3B2A20; --brown-soft:#6B5648; --sage:#7E9473; --sage-dark:#6A8160; --sage-light:#DDE5D2;
    --line:rgba(59,42,32,.13); --danger:#A3473A;
    --shadow:0 10px 30px rgba(59,42,32,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Barlow',system-ui,sans-serif;color:var(--brown);background:var(--cream);overflow-x:hidden}
  body.auth-checking #app{visibility:hidden}
  .auth-check{display:none}
  body.auth-checking .auth-check{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;color:var(--brown-soft);background:var(--cream);font-size:15px;text-align:center}
  button{font-family:inherit;color:inherit}
  .bg{position:fixed;inset:0;z-index:-1;background:
    radial-gradient(900px 600px at 90% 0%, #dccfb7 0%, transparent 60%),
    radial-gradient(700px 600px at 0% 100%, #cdd6bf 0%, transparent 60%),
    var(--cream)}
  .ic{width:18px;height:18px;flex:none}

  /* ---------- layout ---------- */
  .app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
  .scrim{display:none}
  .side{
    position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:18px;
    background:rgba(250,246,236,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-right:1px solid var(--line);overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--brown);font-weight:600;font-size:21px;padding:0 6px}
  .logo{width:42px;height:42px;border-radius:13px;background:var(--sage);display:grid;place-items:center;color:var(--cream);box-shadow:0 6px 16px rgba(126,148,115,.35)}
  .logo .ic{width:20px;height:20px}
  .btn-main{
    border:0;cursor:pointer;background:var(--sage);color:#fffaf0;border-radius:14px;padding:13px 16px;
    font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:9px;
    box-shadow:0 8px 20px rgba(126,148,115,.35);transition:background .2s,transform .1s;
  }
  .btn-main:hover{background:var(--sage-dark)} .btn-main:active{transform:translateY(1px)}
  .btn-main.danger{background:var(--danger);box-shadow:0 8px 20px rgba(163,71,58,.3)}
  .btn-ghost{
    border:1px solid var(--line);cursor:pointer;background:rgba(255,250,240,.9);border-radius:14px;padding:12px 16px;
    font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:9px;transition:background .2s;
  }
  .btn-ghost:hover{background:#fff}

  .nav{display:grid;gap:3px}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:0;background:none;cursor:pointer;
    font-size:15px;font-weight:500;color:var(--brown-soft);text-align:left;width:100%;transition:background .15s,color .15s;
  }
  .nav-item:hover{background:rgba(237,228,207,.8);color:var(--brown)}
  .nav-item.active{background:var(--sage-light);color:var(--brown);font-weight:600}
  .nav-item .n{margin-left:auto;font-family:'DM Mono',monospace;font-size:12px;color:var(--brown-soft)}
  .nav-item.drop{outline:2px dashed var(--sage);background:var(--sage-light)}
  .dot{width:11px;height:11px;border-radius:4px;flex:none}
  .sec{display:flex;align-items:center;justify-content:space-between;padding:0 6px;
    font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brown-soft)}
  .sec button{border:0;background:none;cursor:pointer;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--brown-soft)}
  .sec button:hover{background:var(--cream-2);color:var(--brown)}
  .side-foot{margin-top:auto;display:grid;gap:14px}
  .profile{display:flex;align-items:center;gap:11px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:15px;background:var(--paper)}
  .profile-avatar{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--sage);color:#fffaf0;font-size:16px;font-weight:600;text-transform:uppercase}
  .profile-info{display:grid;gap:2px;min-width:0}
  .profile-info small{color:var(--brown-soft);font-size:11px}
  .profile-info strong,.profile-info span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .profile-info strong{font-size:14px;font-weight:600}
  .profile-info span{color:var(--brown-soft);font-size:12px}
  .meter{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
  .meter b{font-size:14px;font-weight:600}
  .meter small{display:block;color:var(--brown-soft);font-size:13px;margin-top:2px}
  .bar{height:7px;border-radius:99px;background:var(--cream-2);margin:10px 0 2px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--sage);border-radius:99px;min-width:4px;transition:width .4s}
  .private{display:flex;align-items:center;gap:8px;color:var(--sage-dark);font-size:14px;padding:0 6px}
  .private .ic{width:15px;height:15px}
  .signout{color:var(--brown-soft);text-decoration:none;font-size:14px;display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:10px}
  .signout:hover{color:var(--brown)}

  .main{padding:28px clamp(18px,3.4vw,44px) 110px;min-width:0}
  .eyebrow{display:flex;align-items:center;gap:10px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.2em;color:var(--brown-soft);text-transform:uppercase}
  .eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--sage)}
  .mobile-back{display:none}
  .mobile-note{display:none}
  .head{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin:12px 0 22px}
  h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(38px,5vw,60px);line-height:1;letter-spacing:-.02em}
  h1 em{font-style:normal;color:var(--sage)}
  .subline{color:var(--brown-soft);margin-top:10px;font-size:16px}
  .tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .mobile-upload{display:none}
  .search{position:relative}
  .search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--brown-soft)}
  input.q,select.sort{
    background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:11px 14px;font:400 15px 'Barlow',sans-serif;color:var(--brown);outline:none;
  }
  input.q{padding-left:40px;width:230px}
  input.q:focus,select.sort:focus,.mbox input:focus{border-color:var(--sage);box-shadow:0 0 0 4px rgba(126,148,115,.22)}
  .seg{display:flex;background:var(--cream-2);border-radius:13px;padding:3px}
  .seg button{border:0;background:none;width:38px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--brown-soft)}
  .seg button.active{background:#fffaf0;color:var(--brown);box-shadow:0 2px 6px rgba(59,42,32,.1)}
  .burger{display:none;border:1px solid var(--line);background:var(--paper);border-radius:12px;width:42px;height:42px;place-items:center;cursor:pointer}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
  .stat{background:var(--card);border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
  .stat .ico{width:42px;height:42px;border-radius:13px;background:var(--sage-light);color:var(--sage-dark);display:grid;place-items:center}
  .stat small{display:block;font-size:13px;color:var(--brown-soft)}
  .stat b{font-size:22px;font-weight:600}

  .label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--brown-soft);margin:6px 2px 12px;display:flex;align-items:center;justify-content:space-between}

  /* folder cards */
  .folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:28px}
  .fcard{
    background:var(--card);border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:16px;cursor:pointer;text-align:left;
    display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;
  }
  .fcard:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(59,42,32,.12)}
  .fcard.drop{outline:2px dashed var(--sage);background:var(--sage-light)}
  .fcard .tile{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fffaf0;flex:none}
  .fcard b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
  .fcard small{color:var(--brown-soft);font-size:13px}
  .fcard.new{background:transparent;border:1.5px dashed rgba(59,42,32,.25);box-shadow:none;color:var(--brown-soft);font-weight:600;justify-content:center;gap:9px}
  .fcard.new:hover{background:rgba(255,250,240,.6);color:var(--brown)}

  /* media grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .item{position:relative;border-radius:20px;overflow:hidden;background:var(--paper);border:1px solid var(--line);cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
  .item:hover{transform:translateY(-2px)}
  .item.sel{outline:3px solid var(--sage)}
  .item.dragging{opacity:.45}
  .thumb{aspect-ratio:4/3;background:var(--cream-2);position:relative;overflow:hidden}
  .thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .play{position:absolute;left:12px;bottom:12px;width:34px;height:34px;border-radius:50%;background:rgba(250,246,236,.92);display:grid;place-items:center;color:var(--brown)}
  .play .ic{width:14px;height:14px;fill:currentColor}
  .meta{padding:11px 14px 13px}
  .meta b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta small{color:var(--brown-soft);font-size:12.5px}
  .chk{position:absolute;top:10px;left:10px;width:28px;height:28px;border-radius:9px;border:1.5px solid rgba(255,255,255,.95);background:rgba(59,42,32,.28);
    display:grid;place-items:center;cursor:pointer;color:#fff;opacity:0;transition:opacity .15s}
  .chk .ic{width:15px;height:15px;opacity:0}
  .item:hover .chk,.has-sel .chk{opacity:1}
  .item.sel .chk{background:var(--sage);border-color:var(--sage)} .item.sel .chk .ic{opacity:1}
  .acts{position:absolute;top:10px;right:10px;display:flex;gap:6px;opacity:0;transition:opacity .15s}
  .item:hover .acts{opacity:1}
  .acts button,.fav-on{width:30px;height:30px;border-radius:10px;border:0;background:rgba(250,246,236,.94);display:grid;place-items:center;cursor:pointer;color:var(--brown)}
  .acts button:hover{background:#fff}
  .acts button[data-act=del]:hover{color:var(--danger)}
  .acts .ic{width:15px;height:15px}
  .on .ic{fill:currentColor;color:#C0714F}
  .fav-on{position:absolute;bottom:10px;right:10px;color:#C0714F;pointer-events:none}
  .fav-on .ic{width:15px;height:15px;fill:currentColor}

  /* list layout */
  .list{display:grid;gap:8px}
  .list .item{display:grid;grid-template-columns:64px minmax(0,1.6fr) minmax(0,1fr) 90px 120px auto;align-items:center;gap:14px;padding:8px 14px 8px 8px;border-radius:16px}
  .list .item:hover{transform:none}
  .list .thumb{aspect-ratio:1;border-radius:12px}
  .list .play{display:none}
  .list .meta{padding:0}
  .list .meta small{display:none}
  .list .cell{font-size:14px;color:var(--brown-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list .chk{position:static;opacity:1;display:none}
  .list .acts{position:static;opacity:1}
  .list .fav-on{display:none}
  .grid .cell{display:none}

  /* empty */
  .empty{border:2px dashed rgba(59,42,32,.22);border-radius:26px;padding:60px 24px;text-align:center;background:rgba(250,246,236,.5)}
  .empty .big{width:64px;height:64px;border-radius:20px;background:var(--sage-light);color:var(--sage-dark);display:grid;place-items:center;margin:0 auto 18px}
  .empty .big .ic{width:28px;height:28px}
  .empty h3{font-family:'DM Serif Display',serif;font-weight:400;font-size:30px;margin-bottom:8px}
  .empty p{color:var(--brown-soft);max-width:380px;margin:0 auto 22px;line-height:1.6}
  .empty .btn-main{display:inline-flex;padding:13px 24px}

  .crumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .chip:hover{background:#fff}
  .chip.danger:hover{color:var(--danger)}

  /* bulk bar */
  .bulk{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;pointer-events:none;transition:all .25s;z-index:30;
    background:var(--brown);color:var(--cream);border-radius:18px;padding:10px 12px 10px 18px;display:flex;align-items:center;gap:8px;box-shadow:0 18px 40px rgba(59,42,32,.35)}
  .bulk.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .bulk span{font-weight:600;margin-right:8px;font-size:15px}
  .bulk button{border:0;background:rgba(245,238,220,.14);color:var(--cream);border-radius:12px;padding:9px 13px;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px}
  .bulk button:hover{background:rgba(245,238,220,.26)}
  .bulk .ic{width:16px;height:16px}

  /* drop veil */
  .veil{position:fixed;inset:14px;z-index:60;border:3px dashed var(--sage);border-radius:30px;background:rgba(245,238,220,.88);
    display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-family:'DM Serif Display',serif;font-size:36px;pointer-events:none}
  .veil.show{display:flex}
  .veil .ic{width:42px;height:42px;color:var(--sage-dark)}

  /* modal */
  .modal{position:fixed;inset:0;z-index:80;background:rgba(59,42,32,.4);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
  .modal.show{display:flex}
  .mbox{background:var(--cream);border-radius:24px;padding:26px;width:100%;max-width:420px;box-shadow:0 30px 70px rgba(59,42,32,.35);border:1px solid rgba(255,255,255,.6)}
  .mbox h3{font-family:'DM Serif Display',serif;font-weight:400;font-size:28px;margin-bottom:6px}
  .mbox p{color:var(--brown-soft);margin-bottom:16px;line-height:1.5}
  .mbox input{width:100%;background:#fffaf0;border:1px solid var(--line);border-radius:13px;padding:13px 14px;font:400 16px 'Barlow',sans-serif;color:var(--brown);outline:none;margin:8px 0 4px}
  .mact{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .mact .btn-main,.mact .btn-ghost{padding:11px 20px}
  .pick{display:grid;gap:6px;margin:14px 0 4px;max-height:300px;overflow:auto}
  .pick button{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:11px 13px;cursor:pointer;font-size:15px;font-weight:500;text-align:left}
  .pick button:hover{background:var(--sage-light)}
  .pick .n{margin-left:auto;font-family:'DM Mono',monospace;font-size:12px;color:var(--brown-soft)}

  /* lightbox */
  .lb{position:fixed;inset:0;z-index:70;background:rgba(32,22,16,.94);display:none;flex-direction:column;color:#f5eedc}
  .lb.show{display:flex}
  .lb-top{display:flex;align-items:center;gap:12px;padding:16px 22px;color:#f5eedc}
  .lb-top .t{min-width:0;flex:1}
  .lb-top b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lb-top small{color:rgba(245,238,220,.65);font-size:13px}
  .lb-actions{display:flex;align-items:center;gap:10px}
  .lb button{border:1px solid rgba(245,238,220,.24);background:rgba(245,238,220,.14);color:#f5eedc;width:42px;height:42px;border-radius:13px;cursor:pointer;display:grid;place-items:center;flex:none}
  .lb button:hover{background:rgba(245,238,220,.24)}
  .lb button:focus-visible{outline:2px solid #dce8cb;outline-offset:2px}
  .lb button.on .ic{fill:#E39A7B;color:#E39A7B}
  .lb-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 70px 28px;position:relative}
  .lb-stage img,.lb-stage video{max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#000}
  .video-viewer{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
  .video-viewer video{max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#000}
  .video-viewer:fullscreen{padding:24px;background:#000}
  .video-viewer:fullscreen video{max-width:100%;max-height:100%;object-fit:contain}
  .video-fullscreen{position:absolute;top:14px;right:14px;width:auto!important;padding:0 14px;font-size:14px;font-weight:600}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px!important;height:48px!important;border-radius:50%!important}
  .lb-nav.l{left:14px}.lb-nav.r{right:14px}

  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--brown);color:var(--cream);padding:13px 22px;border-radius:14px;
    font-size:15px;opacity:0;pointer-events:none;transition:all .3s;z-index:95;box-shadow:0 12px 30px rgba(59,42,32,.3)}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* responsive */
  @media (max-width:1000px){ .stats{grid-template-columns:repeat(2,1fr)} .list .item{grid-template-columns:56px minmax(0,1fr) auto} .list .cell{display:none} }
  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;z-index:50;width:288px;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 60px rgba(59,42,32,.3);background:var(--cream)}
    .nav-open .side{transform:none}
    .scrim{position:fixed;inset:0;background:rgba(59,42,32,.35);z-index:40;display:none}
    .nav-open .scrim{display:block}
    .burger{display:grid}
    .mobile-upload{display:flex}
    input.q{width:100%} .search{flex:1;min-width:150px}
    .tools{width:100%}
    .lb-stage{padding:0 12px 20px}
    .lb-nav{display:none!important}
  }
  @media (max-width:520px){
    .lb-top{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:12px}
    .lb-top .t{width:100%}
    .lb-top b{white-space:normal;overflow-wrap:anywhere;line-height:1.3}
    .lb-actions{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;width:100%}
    .lb-actions button{width:100%;height:44px;border-radius:12px}
  }
  @media (max-width:520px){
    .main{padding:16px 14px 72px}
    .eyebrow{gap:0}
    .eyebrow > i,#eyebrowText,.mobile-back{display:none}
    .mobile-note{display:block;margin-left:auto;color:var(--brown-soft);font-size:13px;font-weight:500;letter-spacing:0;text-transform:none}
    .head{gap:14px;margin:14px 0 18px}
    .head h1{font-size:clamp(34px,10vw,44px)}
    .tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
    .search{grid-column:1/-1;width:100%;min-width:0}
    input.q{width:100%;min-width:0}
    select.sort{grid-column:1;grid-row:2;min-width:0}
    .seg{grid-column:2;grid-row:2;justify-self:end;align-self:stretch;width:max-content;align-items:center;background:var(--paper);border:1px solid var(--line);padding:3px}
    .seg button{width:42px;height:42px;color:var(--brown-soft)}
    .seg button.active{background:var(--sage);color:#fffaf0;box-shadow:0 2px 6px rgba(0,0,0,.2)}
    :root[data-theme="dark"] .tools .seg button.active{background:var(--sage);color:#1b201c}
    .mobile-upload{grid-column:1/-1;grid-row:3;width:100%}
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .folders{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .fcard{min-width:0;padding:12px;gap:9px}
    .fcard .tile{width:38px;height:38px}
    .fcard b{max-width:100px}
    .stats{gap:10px}

  }
</style>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $ = function(id){return document.getElementById(id)};
var ICON = {
  heart:'<path d="M12 21s-7-4.6-9.3-9.1C1.1 8.7 3 5 6.5 5c2 0 3.5 1 5.5 3 2-2 3.5-3 5.5-3C21 5 22.9 8.7 21.3 11.9 19 16.4 12 21 12 21z"/>',
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>',
  folderPlus:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M12 10v5M9.5 12.5h5"/>',
  move:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M9 13h6M13 10l3 3-3 3"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  video:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>',
  download:'<path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>',
  inbox:'<path d="M3 13l3-8h12l3 8v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-6z"/><path d="M3 13h5l1 3h6l1-3h5"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  chevL:'<path d="M15 18l-6-6 6-6"/>', chevR:'<path d="M9 6l6 6-6 6"/>',
  play:'<path d="M8 5v14l11-7z"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  hdd:'<rect x="3" y="13" width="18" height="7" rx="2"/><path d="M3 13l3-8h12l3 8M7 16.5h.01"/>'
};
function ic(n,c){return '<svg class="ic '+(c||'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICON[n]+'</svg>'}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmtSize(b){
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(0)+' KB';
  if(b<1073741824) return (b/1048576).toFixed(1)+' MB';
  if(b<1099511627776) return (b/1073741824).toFixed(b<1.07e10?2:0)+' GB';
  return (b/1099511627776).toFixed(0)+' TB';
}
function fmtDate(t){return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
var isImg = function(m){return m.type.indexOf('image/')===0};
var COLORS=['#7E9473','#B08968','#C0714F','#C9A24D','#8A7F9E','#6F8F8C'];
/* Storage plan limit shown in the meter and enforced on upload (253 GB). */
var PLAN_LIMIT = 253*1024*1024*1024;

/* ---------- static icons ---------- */
$('uploadBtn').innerHTML=ic('upload')+'Upload media';
$('newFolderBtn').innerHTML=ic('plus');
$('burger').innerHTML=ic('menu');
$('privateLine').innerHTML=ic('lock')+'Files stay on this device';
$('signout').innerHTML=ic('logout')+'Sign out';
$('eyebrowText').textContent='Personal vault  |  '+new Date().toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}).toUpperCase().replace(',',',');

function renderProfile(user){
  var metadata=user.user_metadata||{};
  var email=user.email||'';
  var name=String(metadata.full_name||metadata.name||'').trim();
  if(!name&&email) name=email.split('@')[0];
  if(!name) name='Vaultly user';
  $('profileName').textContent=name;
  $('profileEmail').textContent=email;
  $('profileEmail').hidden=!email;
  $('profileAvatar').textContent=name.charAt(0).toUpperCase();
}

/* ---------- storage (IndexedDB, in this browser) ---------- */
var db=null, memOnly=false, currentUserId='';
function openDB(){
  return new Promise(function(res){
    try{
      var r=indexedDB.open('vaultly-'+currentUserId,1);
      r.onupgradeneeded=function(){var d=r.result;d.createObjectStore('media',{keyPath:'id'});d.createObjectStore('folders',{keyPath:'id'})};
      r.onsuccess=function(){db=r.result;res(true)};
      r.onerror=function(){memOnly=true;res(false)};
    }catch(e){memOnly=true;res(false)}
  });
}
function dbAll(store){
  return new Promise(function(res){
    if(!db) return res([]);
    var q=db.transaction(store).objectStore(store).getAll();
    q.onsuccess=function(){res(q.result||[])}; q.onerror=function(){res([])};
  });
}
function dbPut(store,obj){
  return new Promise(function(res){
    if(!db) return res(true);
    try{var t=db.transaction(store,'readwrite');t.objectStore(store).put(obj);t.oncomplete=function(){res(true)};t.onerror=function(){res(false)};t.onabort=function(){res(false)}}catch(e){res(false)}
  });
}
function dbDel(store,id){
  return new Promise(function(res){
    if(!db) return res();
    try{var t=db.transaction(store,'readwrite');t.objectStore(store).delete(id);t.oncomplete=res;t.onerror=res;t.onabort=res}catch(e){res()}
  });
}

/* ---------- state ---------- */
var folders=[], media=[], view='all', q='', sort='new', layout='grid';
var selected=new Set(), urls={};
function urlFor(m){return urls[m.id]||(urls[m.id]=URL.createObjectURL(m.blob))}
function revoke(id){if(urls[id]){URL.revokeObjectURL(urls[id]);delete urls[id]}}
function folderById(id){return folders.filter(function(f){return f.id===id})[0]}
function countIn(fid){return media.filter(function(m){return m.folderId===fid}).length}
function currentFolderId(){return view.indexOf('f:')===0?view.slice(2):null}

function visible(){
  var l=media.filter(function(m){
    if(view==='photos') return isImg(m);
    if(view==='videos') return !isImg(m);
    if(view==='fav') return m.fav;
    if(view==='unsorted') return !m.folderId;
    if(view.indexOf('f:')===0) return m.folderId===view.slice(2);
    return true;
  });
  if(q) l=l.filter(function(m){return m.name.toLowerCase().indexOf(q.toLowerCase())>-1});
  l.sort(function(a,b){
    if(sort==='old') return a.added-b.added;
    if(sort==='name') return a.name.localeCompare(b.name);
    if(sort==='size') return b.size-a.size;
    return b.added-a.added;
  });
  return l;
}

/* ---------- toast + dialogs ---------- */
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},2800)}

function dialog(o){
  return new Promise(function(res){
    var m=$('modal');
    m.innerHTML='<div class="mbox"><h3>'+esc(o.title)+'</h3>'+(o.desc?'<p>'+esc(o.desc)+'</p>':'')+
      (o.input!=null?'<input id="mIn" type="text" maxlength="'+(o.maxlength||40)+'" placeholder="'+esc(o.input)+'" value="'+esc(o.value||'')+'">':'')+
      '<div class="mact"><button class="btn-ghost" data-r="0">Cancel</button><button class="btn-main'+(o.danger?' danger':'')+'" data-r="1">'+esc(o.ok||'OK')+'</button></div></div>';
    m.classList.add('show');
    var inp=$('mIn'); if(inp){inp.focus();inp.select()}
    function done(v){m.classList.remove('show');m.onclick=null;document.removeEventListener('keydown',kd,true);res(v)}
    function kd(e){
      if(e.key==='Escape'){e.stopPropagation();done(null)}
      if(e.key==='Enter'&&inp){e.preventDefault();done(inp.value.trim()||null)}
    }
    document.addEventListener('keydown',kd,true);
    m.onclick=function(e){
      var r=e.target.closest('[data-r]');
      if(r) done(r.dataset.r==='1'?(inp?(inp.value.trim()||null):true):null);
      else if(e.target===m) done(null);
    };
  });
}

function createFolder(name){
  var f={id:uid(),name:name,color:COLORS[folders.length%COLORS.length],created:Date.now()};
  folders.push(f); dbPut('folders',f); return f;
}

async function pickFolder(){
  return new Promise(function(res){
    var m=$('modal');
    var rows='<button data-f="">'+ic('inbox')+'Unsorted<span class="n">no folder</span></button>'+
      folders.map(function(f){return '<button data-f="'+f.id+'"><span class="dot" style="background:'+f.color+'"></span>'+esc(f.name)+'<span class="n">'+countIn(f.id)+'</span></button>'}).join('')+
      '<button data-f="__new">'+ic('folderPlus')+'New folder...</button>';
    m.innerHTML='<div class="mbox"><h3>Move to folder</h3><div class="pick">'+rows+'</div><div class="mact"><button class="btn-ghost" data-c="1">Cancel</button></div></div>';
    m.classList.add('show');
    function done(v){m.classList.remove('show');m.onclick=null;document.removeEventListener('keydown',kd,true);res(v)}
    function kd(e){if(e.key==='Escape'){e.stopPropagation();done(undefined)}}
    document.addEventListener('keydown',kd,true);
    m.onclick=async function(e){
      var b=e.target.closest('[data-f]');
      if(b){
        var v=b.dataset.f;
        if(v==='__new'){
          m.classList.remove('show'); m.onclick=null; document.removeEventListener('keydown',kd,true);
          var name=await dialog({title:'New folder',input:'Folder name',ok:'Create'});
          if(!name) return res(undefined);
          return res(createFolder(name).id);
        }
        return done(v===''?null:v);
      }
      if(e.target.closest('[data-c]')||e.target===m) done(undefined);
    };
  });
}

/* ---------- actions ---------- */
async function addFiles(files,folderId){
  var list=Array.prototype.slice.call(files).filter(function(f){return /^(image|video)\//.test(f.type)});
  if(!list.length){toast('Only photos and videos can be added.');return}
  var used=media.reduce(function(s,x){return s+x.size},0), added=0, reason='';
  for(var i=0;i<list.length;i++){
    var f=list[i];
    if(used+f.size>PLAN_LIMIT){reason='plan';break}
    var m={id:uid(),name:f.name,type:f.type,size:f.size,folderId:folderId||null,fav:false,added:Date.now()+i,blob:f};
    var ok=await dbPut('media',m);
    if(!ok){reason='device';break}
    media.push(m); used+=f.size; added++;
  }
  render();
  if(reason==='plan') toast('Your '+fmtSize(PLAN_LIMIT)+' plan is full. Free up space to add more.');
  else if(reason==='device') toast('This device is out of space for the browser. Free up disk space and try again.');
  else toast(added+(added>1?' files':' file')+' added'+(folderId&&folderById(folderId)?' to '+folderById(folderId).name:''));
}
function moveItems(ids,fid){
  ids.forEach(function(id){
    var m=media.filter(function(x){return x.id===id})[0];
    if(m){m.folderId=fid||null;dbPut('media',m)}
  });
  selected.clear(); render();
  toast('Moved '+ids.length+(ids.length>1?' items':' item')+' to '+(fid?folderById(fid).name:'Unsorted'));
}
async function removeFromFolder(id){
  var m=media.filter(function(x){return x.id===id})[0]; if(!m||!m.folderId) return false;
  var oldFolderId=m.folderId;
  m.folderId=null;
  if(!await dbPut('media',m)){
    m.folderId=oldFolderId;
    toast('Could not remove this item from the folder. Please try again.');
    return false;
  }
  selected.delete(id);
  render();
  toast('Removed from folder and moved to Unsorted');
  return true;
}
async function renameMedia(id){
  var m=media.filter(function(x){return x.id===id})[0]; if(!m) return false;
  var name=await dialog({title:'Rename media',desc:'This name will appear in your vault and on downloads.',input:'File name',value:m.name,ok:'Save',maxlength:255});
  if(!name||name===m.name) return false;
  var oldName=m.name;
  m.name=name;
  if(!await dbPut('media',m)){
    m.name=oldName;
    toast('Could not save the new name. Please try again.');
    return false;
  }
  render();
  toast('Renamed');
  return true;
}
async function deleteItems(ids){
  var ok=await dialog({title:ids.length>1?'Delete '+ids.length+' items?':'Delete this item?',desc:'This removes it from your vault in this browser. You can\'t undo this.',ok:'Delete',danger:true});
  if(!ok) return false;
  for(var i=0;i<ids.length;i++){revoke(ids[i]);await dbDel('media',ids[i])}
  media=media.filter(function(m){return ids.indexOf(m.id)<0});
  ids.forEach(function(id){selected.delete(id)});
  render(); toast('Deleted'); return true;
}
function toggleFav(id){
  var m=media.filter(function(x){return x.id===id})[0]; if(!m) return;
  m.fav=!m.fav; dbPut('media',m); render();
}
function download(id){
  var m=media.filter(function(x){return x.id===id})[0]; if(!m) return;
  var a=document.createElement('a'); a.href=urlFor(m); a.download=m.name; document.body.appendChild(a); a.click(); a.remove();
}
function setView(v){view=v;q='';selected.clear();document.body.classList.remove('nav-open');render();window.scrollTo(0,0)}

/* ---------- render ---------- */
function render(){ renderSide(); renderMain(); renderBulk(); }

function renderSide(){
  var nav=[
    ['all','layers','All media',media.length],
    ['photos','image','Photos',media.filter(isImg).length],
    ['videos','video','Videos',media.filter(function(m){return !isImg(m)}).length],
    ['fav','heart','Favorites',media.filter(function(m){return m.fav}).length],
    ['unsorted','inbox','Unsorted',media.filter(function(m){return !m.folderId}).length]
  ];
  $('nav').innerHTML=nav.map(function(n){
    return '<button class="nav-item'+(view===n[0]?' active':'')+'" data-view="'+n[0]+'"'+(n[0]==='unsorted'?' data-drop="">':'>')+ic(n[1])+n[2]+'<span class="n">'+n[3]+'</span></button>';
  }).join('');
  $('folderNav').innerHTML=folders.length?folders.map(function(f){
    return '<button class="nav-item'+(view==='f:'+f.id?' active':'')+'" data-view="f:'+f.id+'" data-drop="'+f.id+'"><span class="dot" style="background:'+f.color+'"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(f.name)+'</span><span class="n">'+countIn(f.id)+'</span></button>';
  }).join(''):'<div style="padding:6px 12px;color:var(--brown-soft);font-size:14px">No folders yet</div>';

  var used=media.reduce(function(s,m){return s+m.size},0);
  var pct=Math.max(media.length?2:0,Math.min(100,used/PLAN_LIMIT*100));
  $('meter').innerHTML='<b>'+fmtSize(used)+' used</b><small>of '+fmtSize(PLAN_LIMIT)+' plan</small><div class="bar"><i style="width:'+pct+'%"></i></div><small id="devNote"></small>';
  if(navigator.storage&&navigator.storage.estimate){
    navigator.storage.estimate().then(function(e){
      var n=$('devNote');
      if(n&&e&&e.quota&&e.quota<PLAN_LIMIT) n.textContent='This browser has room for about '+fmtSize(e.quota)+' right now.';
    }).catch(function(){});
  }
}

function itemHTML(m){
  var f=m.folderId?folderById(m.folderId):null;
  var thumb=isImg(m)?'<img src="'+urlFor(m)+'" alt="'+esc(m.name)+'" loading="lazy">':'<video src="'+urlFor(m)+'#t=0.5" preload="metadata" muted playsinline></video><span class="play">'+ic('play')+'</span>';
  return '<article class="item'+(selected.has(m.id)?' sel':'')+'" draggable="true" data-id="'+m.id+'">'+
    '<div class="thumb">'+thumb+(m.fav?'<span class="fav-on">'+ic('heart')+'</span>':'')+'</div>'+
    '<button class="chk" data-act="sel" aria-label="Select">'+ic('check')+'</button>'+
    '<div class="meta"><b>'+esc(m.name)+'</b><small>'+fmtSize(m.size)+'  |  '+fmtDate(m.added)+'</small></div>'+
    '<div class="cell">'+(f?esc(f.name):'Unsorted')+'</div><div class="cell">'+fmtSize(m.size)+'</div><div class="cell">'+fmtDate(m.added)+'</div>'+
    '<div class="acts">'+
      '<button data-act="fav" class="'+(m.fav?'on':'')+'" title="Favorite" aria-label="Favorite">'+ic('heart')+'</button>'+
      '<button data-act="rename" title="Rename" aria-label="Rename">'+ic('edit')+'</button>'+
      '<button data-act="move" title="Move to folder" aria-label="Move">'+ic('move')+'</button>'+
      (m.folderId?'<button data-act="remove-folder" title="Remove from folder" aria-label="Remove from folder">'+ic('inbox')+'</button>':'')+
      '<button data-act="dl" title="Download" aria-label="Download">'+ic('download')+'</button>'+
      '<button data-act="del" title="Delete" aria-label="Delete">'+ic('trash')+'</button>'+
    '</div></article>';
}

function renderMain(){
  var titles={all:['Your memories,','in one place.'],photos:['All','photos.'],videos:['All','videos.'],fav:['Your','favorites.'],unsorted:['Not yet','organized.']};
  var t,fid=currentFolderId(),fol=fid?folderById(fid):null;
  if(fid&&!fol){view='all';return renderMain()}
  t=fol?[esc(fol.name),'']:titles[view];
  var list=visible();
  var h='<div class="head"><div><h1>'+(fol?esc(fol.name):t[0]+(t[1]?'<br><em>'+t[1]+'</em>':''))+'</h1>'+
    '<div class="subline">'+list.length+(list.length===1?' item':' items')+(q?' matching "'+esc(q)+'"':'')+'</div>'+
    (fol?'<div class="crumbs"><button class="chip" data-a="rename">'+ic('edit')+'Rename</button><button class="chip danger" data-a="delfolder">'+ic('trash')+'Delete folder</button></div>':'')+
    '</div><div class="tools">'+
      '<div class="search">'+ic('search')+'<input class="q" id="q" type="search" placeholder="Search by name" value="'+esc(q)+'"></div>'+
      '<select class="sort" id="sort"><option value="new">Newest</option><option value="old">Oldest</option><option value="name">Name</option><option value="size">Size</option></select>'+
      '<button class="btn-main mobile-upload" data-a="upload">'+ic('upload')+'Upload media</button>'+
      '<div class="seg"><button data-layout="grid" class="'+(layout==='grid'?'active':'')+'" aria-label="Grid view">'+ic('grid')+'</button><button data-layout="list" class="'+(layout==='list'?'active':'')+'" aria-label="List view">'+ic('list')+'</button></div>'+
    '</div></div>';

  if(view==='all'&&!q){
    var used=media.reduce(function(s,m){return s+m.size},0);
    h+='<div class="stats">'+
      stat('image',media.length,'Total media')+stat('image',media.filter(isImg).length,'Photos')+stat('video',media.filter(function(m){return !isImg(m)}).length,'Videos')+stat('hdd',fmtSize(used),'Storage used')+'</div>';
    h+='<div class="label"><span>Folders</span></div><div class="folders">'+
      folders.map(function(f){return '<button class="fcard" data-view="f:'+f.id+'" data-drop="'+f.id+'"><span class="tile" style="background:'+f.color+'">'+ic('folder')+'</span><span><b>'+esc(f.name)+'</b><small>'+countIn(f.id)+' items</small></span></button>'}).join('')+
      '<button class="fcard new" data-a="newfolder">'+ic('folderPlus')+'New folder</button></div>';
    h+='<div class="label"><span>Recent</span></div>';
  }

  if(!list.length){
    if(media.length===0&&view==='all'&&!q){
      h+='<div class="empty"><div class="big">'+ic('upload')+'</div><h3>Add your first memories</h3><p>Drag photos and videos anywhere on this page, or choose them from your device. Then sort them into folders.</p><button class="btn-main" data-a="upload">'+ic('upload')+'Upload media</button></div>';
    } else {
      h+='<div class="empty"><div class="big">'+ic(view==='fav'?'heart':'image')+'</div><h3>'+(q?'Nothing found':'Nothing here yet')+'</h3><p>'+(q?'Try a different name.':fol?'Drop files onto this page, or move items here from your other folders.':'Items will show up here as you add them.')+'</p>'+(q?'':'<button class="btn-main" data-a="upload">'+ic('upload')+'Upload media</button>')+'</div>';
    }
  } else {
    h+='<div class="'+(layout==='list'?'list':'grid')+(selected.size?' has-sel':'')+'" id="items">'+list.map(itemHTML).join('')+'</div>';
  }
  var keepFocus=document.activeElement&&document.activeElement.id==='q';
  var pos=keepFocus?document.activeElement.selectionStart:0;
  $('content').innerHTML=h;
  $('sort').value=sort;
  if(keepFocus){var qi=$('q');qi.focus();try{qi.setSelectionRange(pos,pos)}catch(e){}}
}
function stat(i,v,l){return '<div class="stat"><span class="ico">'+ic(i)+'</span><div><small>'+l+'</small><b>'+v+'</b></div></div>'}

function renderBulk(){
  var b=$('bulk'),n=selected.size;
  b.classList.toggle('show',n>0);
  b.innerHTML='<span>'+n+' selected</span><button data-b="move">'+ic('move')+'Move</button><button data-b="del">'+ic('trash')+'Delete</button><button data-b="clear">'+ic('x')+'Clear</button>';
}

/* ---------- events ---------- */
$('uploadBtn').onclick=function(){$('file').click()};
$('file').onchange=function(e){addFiles(e.target.files,currentFolderId());e.target.value=''};
$('signout').addEventListener('click',async function(e){
  e.preventDefault();
  var auth=window.vaultlySupabase;
  if(!auth){location.replace('auth.html#signin');return}
  try{
    var result=await auth.auth.signOut();
    if(result.error){toast('Sign out failed: '+result.error.message);return}
    location.replace('auth.html#signin');
  }catch(error){toast('Sign out failed: '+error.message)}
});
$('burger').onclick=function(){document.body.classList.add('nav-open')};
$('scrim').onclick=function(){document.body.classList.remove('nav-open')};
$('newFolderBtn').onclick=newFolderFlow;

async function newFolderFlow(){
  var name=await dialog({title:'New folder',desc:'Give it a name like Family, Travel or Birthdays.',input:'Folder name',ok:'Create'});
  if(!name) return;
  var f=createFolder(name); setView('f:'+f.id); toast('Folder "'+f.name+'" created');
}

document.addEventListener('click',async function(e){
  if(Date.now()<suppressMediaClickUntil&&e.target.closest('.item')){e.preventDefault();return}
  var v=e.target.closest('[data-view]');
  if(v&&!e.target.closest('[data-act]')){setView(v.dataset.view);return}

  var a=e.target.closest('[data-a]');
  if(a){
    var k=a.dataset.a;
    if(k==='upload') $('file').click();
    else if(k==='newfolder') newFolderFlow();
    else if(k==='rename'){
      var f=folderById(currentFolderId());
      var name=await dialog({title:'Rename folder',input:'Folder name',value:f.name,ok:'Save'});
      if(name){f.name=name;dbPut('folders',f);render()}
    } else if(k==='delfolder'){
      var f2=folderById(currentFolderId());
      var ok=await dialog({title:'Delete "'+f2.name+'"?',desc:'The '+countIn(f2.id)+' items inside will be kept and moved to Unsorted.',ok:'Delete folder',danger:true});
      if(ok){
        media.forEach(function(m){if(m.folderId===f2.id){m.folderId=null;dbPut('media',m)}});
        folders=folders.filter(function(x){return x.id!==f2.id}); await dbDel('folders',f2.id);
        setView('all'); toast('Folder deleted');
      }
    }
    return;
  }

  var lay=e.target.closest('[data-layout]');
  if(lay){layout=lay.dataset.layout;render();return}

  var bb=e.target.closest('[data-b]');
  if(bb){
    var ids=Array.from(selected);
    if(bb.dataset.b==='clear'){selected.clear();render()}
    if(bb.dataset.b==='move'){var fid=await pickFolder();if(fid!==undefined)moveItems(ids,fid)}
    if(bb.dataset.b==='del') deleteItems(ids);
    return;
  }

  var item=e.target.closest('.item');
  if(item){
    var id=item.dataset.id, act=e.target.closest('[data-act]');
    if(act){
      var ac=act.dataset.act;
      if(ac==='fav') toggleFav(id);
      else if(ac==='rename') renameMedia(id);
      else if(ac==='dl') download(id);
      else if(ac==='del') deleteItems([id]);
      else if(ac==='move'){var f3=await pickFolder();if(f3!==undefined)moveItems([id],f3)}
      else if(ac==='remove-folder') removeFromFolder(id);
      else if(ac==='sel'){selected.has(id)?selected.delete(id):selected.add(id);render()}
    } else if(selected.size){
      selected.has(id)?selected.delete(id):selected.add(id);render();
    } else openLb(id);
  }
});

document.addEventListener('input',function(e){
  if(e.target.id==='q'){q=e.target.value;renderMain()}
});
document.addEventListener('change',function(e){
  if(e.target.id==='sort'){sort=e.target.value;renderMain()}
});

/* drag items onto folders, and drop files to upload */
var dragIds=[];
document.addEventListener('dragstart',function(e){
  var it=e.target.closest&&e.target.closest('.item'); if(!it) return;
  var id=it.dataset.id;
  dragIds=selected.has(id)?Array.from(selected):[id];
  e.dataTransfer.setData('text/x-vaultly',id); e.dataTransfer.effectAllowed='move';
  it.classList.add('dragging');
});
document.addEventListener('dragend',function(e){
  dragIds=[]; document.querySelectorAll('.dragging,.drop').forEach(function(x){x.classList.remove('dragging','drop')});
});
function hasFiles(e){return e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],'Files')>-1}
var dragDepth=0;
window.addEventListener('dragenter',function(e){
  if(!hasFiles(e)) return; dragDepth++;
  $('veil').innerHTML=ic('upload')+'<span>Drop to add to your vault</span>'; $('veil').classList.add('show');
});
window.addEventListener('dragleave',function(e){
  if(!hasFiles(e)) return; dragDepth=Math.max(0,dragDepth-1); if(!dragDepth) $('veil').classList.remove('show');
});
window.addEventListener('dragover',function(e){
  var tgt=e.target.closest&&e.target.closest('[data-drop]');
  document.querySelectorAll('.drop').forEach(function(x){if(x!==tgt)x.classList.remove('drop')});
  if(tgt&&dragIds.length){e.preventDefault();e.dataTransfer.dropEffect='move';tgt.classList.add('drop');$('veil').classList.remove('show')}
  else if(tgt){e.preventDefault();tgt.classList.add('drop');$('veil').classList.remove('show')}
  else if(hasFiles(e)){e.preventDefault();$('veil').classList.add('show')}
});
window.addEventListener('drop',function(e){
  var tgt=e.target.closest&&e.target.closest('[data-drop]');
  $('veil').classList.remove('show'); dragDepth=0;
  document.querySelectorAll('.drop').forEach(function(x){x.classList.remove('drop')});
  if(hasFiles(e)){
    e.preventDefault();
    var fid=tgt?(tgt.dataset.drop||null):currentFolderId();
    addFiles(e.dataTransfer.files,fid);
  } else {
    var draggedId=e.dataTransfer.getData('text/x-vaultly');
    if(draggedId&&!dragIds.length) dragIds=[draggedId];
    if(tgt&&dragIds.length){
      e.preventDefault();
      moveItems(dragIds,tgt.dataset.drop||null);
    }
  }
});

var touchDragTimer=null, touchDragItem=null, touchStartPoint=null, touchDropTarget=null;
var touchDragging=false, suppressMediaClickUntil=0;
document.addEventListener('touchstart',function(e){
  var item=e.target.closest&&e.target.closest('.item');
  if(!item||e.touches.length!==1||e.target.closest('button')) return;
  clearTimeout(touchDragTimer);
  touchDragItem=item;
  touchStartPoint={x:e.touches[0].clientX,y:e.touches[0].clientY};
  touchDragging=false;
  touchDragTimer=setTimeout(function(){
    if(!touchDragItem) return;
    var id=touchDragItem.dataset.id;
    dragIds=selected.has(id)?Array.from(selected):[id];
    touchDragging=true;
    touchDragItem.classList.add('dragging');
    toast('Drag onto a folder, or release to choose one');
  },450);
},{passive:true});
document.addEventListener('touchmove',function(e){
  if(!touchDragItem||e.touches.length!==1) return;
  var touch=e.touches[0];
  if(!touchDragging){
    if(Math.hypot(touch.clientX-touchStartPoint.x,touch.clientY-touchStartPoint.y)>10){
      clearTimeout(touchDragTimer);
      touchDragItem=null;
    }
    return;
  }
  e.preventDefault();
  var under=document.elementFromPoint(touch.clientX,touch.clientY);
  var target=under&&under.closest('[data-drop]');
  document.querySelectorAll('.drop').forEach(function(el){if(el!==target)el.classList.remove('drop')});
  touchDropTarget=target;
  if(target) target.classList.add('drop');
},{passive:false});
async function finishTouchDrag(chooseFolder){
  clearTimeout(touchDragTimer);
  if(touchDragging){
    suppressMediaClickUntil=Date.now()+500;
    if(touchDropTarget){
      moveItems(dragIds,touchDropTarget.dataset.drop||null);
    }else if(chooseFolder){
      var ids=dragIds.slice();
      var folderId=await pickFolder();
      if(folderId!==undefined) moveItems(ids,folderId);
    }
  }
  document.querySelectorAll('.dragging,.drop').forEach(function(el){el.classList.remove('dragging','drop')});
  touchDragItem=null;
  touchStartPoint=null;
  touchDropTarget=null;
  touchDragging=false;
  dragIds=[];
}
document.addEventListener('touchend',function(){finishTouchDrag(true)},{passive:true});
document.addEventListener('touchcancel',function(){finishTouchDrag(false)},{passive:true});

/* ---------- lightbox ---------- */
var lbList=[], lbIdx=-1;
function openLb(id){lbList=visible();lbIdx=lbList.findIndex(function(m){return m.id===id});if(lbIdx>-1){$('lb').classList.add('show');showLb()}}
function closeLb(){$('lb').classList.remove('show');$('lb').innerHTML=''}
function showLb(){
  var m=lbList[lbIdx]; if(!m) return closeLb();
  var f=m.folderId?folderById(m.folderId):null;
  $('lb').innerHTML=
    '<div class="lb-top"><div class="t"><b>'+esc(m.name)+'</b><small>'+(f?esc(f.name):'Unsorted')+'  |  '+fmtSize(m.size)+'  |  '+fmtDate(m.added)+'</small></div><div class="lb-actions">'+
    '<button data-l="fav" class="'+(m.fav?'on':'')+'" aria-label="Favorite">'+ic('heart')+'</button>'+
    '<button data-l="rename" aria-label="Rename">'+ic('edit')+'</button>'+
    '<button data-l="move" aria-label="Move">'+ic('move')+'</button>'+
    (m.folderId?'<button data-l="remove-folder" aria-label="Remove from folder">'+ic('inbox')+'</button>':'')+
    '<button data-l="dl" aria-label="Download">'+ic('download')+'</button>'+
    '<button data-l="del" aria-label="Delete">'+ic('trash')+'</button>'+
    '<button data-l="close" aria-label="Close">'+ic('x')+'</button></div></div>'+
    '<div class="lb-stage">'+(lbList.length>1?'<button class="lb-nav l" data-l="prev" aria-label="Previous">'+ic('chevL')+'</button><button class="lb-nav r" data-l="next" aria-label="Next">'+ic('chevR')+'</button>':'')+
    (isImg(m)?'<img src="'+urlFor(m)+'" alt="'+esc(m.name)+'">':'<div class="video-viewer" id="videoView"><video src="'+urlFor(m)+'" controls controlslist="nofullscreen" autoplay playsinline></video><button class="video-fullscreen" data-l="fullscreen">Full screen</button></div>')+'</div>';
}
document.addEventListener('fullscreenchange',function(){
  var backButton=document.querySelector('[data-l="fullscreen"]');
  if(backButton) backButton.textContent=document.fullscreenElement?'Back to vault':'Full screen';
});
function lbStep(d){if(lbList.length<2)return;lbIdx=(lbIdx+d+lbList.length)%lbList.length;showLb()}
$('lb').addEventListener('click',async function(e){
  var b=e.target.closest('[data-l]'); var m=lbList[lbIdx];
  if(!b){ if(e.target.classList.contains('lb-stage')) closeLb(); return }
  var k=b.dataset.l;
  if(k==='close') closeLb();
  else if(k==='fullscreen'){
    var videoView=$('videoView');
    if(document.fullscreenElement===videoView){
      await document.exitFullscreen();
      closeLb();
    }else if(videoView&&videoView.requestFullscreen){
      try{await videoView.requestFullscreen()}
      catch(error){toast('Could not open full screen: '+error.message)}
    }else{
      toast('Full screen video is not supported in this browser.');
    }
  }
  else if(k==='prev') lbStep(-1);
  else if(k==='next') lbStep(1);
  else if(k==='fav'){toggleFav(m.id);showLb()}
  else if(k==='rename'){
    var renamed=await renameMedia(m.id);
    if(renamed){
      lbList=visible();
      lbIdx=lbList.findIndex(function(item){return item.id===m.id});
      if(lbIdx>-1) showLb(); else closeLb();
    }
  }
  else if(k==='remove-folder'){
    var removed=await removeFromFolder(m.id);
    if(removed){
      lbList=visible();
      lbIdx=lbList.findIndex(function(item){return item.id===m.id});
      if(lbIdx>-1) showLb(); else closeLb();
    }
  }
  else if(k==='dl') download(m.id);
  else if(k==='move'){var fid=await pickFolder();if(fid!==undefined){moveItems([m.id],fid);lbList=visible();lbIdx=Math.min(lbIdx,lbList.length-1);lbList.length?showLb():closeLb()}}
  else if(k==='del'){
    var ok=await deleteItems([m.id]);
    if(ok){lbList.splice(lbIdx,1);if(!lbList.length)closeLb();else{lbIdx=Math.min(lbIdx,lbList.length-1);showLb()}}
  }
});
document.addEventListener('keydown',function(e){
  if($('modal').classList.contains('show')) return;
  if($('lb').classList.contains('show')){
    if(e.key==='Escape') closeLb();
    if(e.key==='ArrowLeft') lbStep(-1);
    if(e.key==='ArrowRight') lbStep(1);
  } else if(e.key==='Escape'&&selected.size){selected.clear();render()}
});

/* ---------- boot ---------- */
(async function init(){
  var auth=window.vaultlySupabase;
  if(!auth){location.replace('auth.html#signin');return}
  var sessionResult;
  try{
    sessionResult=await auth.auth.getSession()
  }
  catch(error){
    document.querySelector('.auth-check').textContent='Could not verify your Vaultly session: '+error.message;
    return;
  }
  if(sessionResult.error){
    document.querySelector('.auth-check').textContent='Could not verify your Vaultly session: '+sessionResult.error.message;
    return;
  }
  if(!sessionResult.data.session){
    location.replace('auth.html#signin');
    return;
  }
  var user=sessionResult.data.session.user;
  currentUserId=user.id;
  renderProfile(user);
  document.body.classList.remove('auth-checking');
  auth.auth.onAuthStateChange(function(event,session){
    if(event==='SIGNED_OUT'||!session) location.replace('auth.html#signin');
  });
  await openDB();
  folders=await dbAll('folders'); media=await dbAll('media');
  folders.sort(function(a,b){return a.created-b.created});
  if(!folders.length){
    ['Family','Travel','Events'].forEach(function(n){createFolder(n)});
  }
  var hash=location.hash.replace('#','');
  if(hash==='photos'||hash==='videos'||hash==='fav') view=hash;
  render();
  if(memOnly) toast('Private mode: files will clear when you close this tab.');
  if(document.documentElement.classList.contains('show-dashboard-splash')){
    var splash=document.querySelector('#dashboardSplash');
    window.setTimeout(function(){
      splash.classList.add('is-leaving');
      window.setTimeout(function(){splash.remove()},500);
    },250);
  }
})();
})();
</script>
